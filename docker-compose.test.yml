# notnet Docker test environment
# Two scenarios:
#   a) no-network - just verify bot init + loop + shutdown
#   b) mock-c2 - connect bot to mock IRC + HTTP C2 servers

services:
  # ── Scenario A: No-network test ──
  bot-no-net:
    build: .
    container_name: notnet-no-net
    network_mode: none
    volumes:
      - ./tests/notnet.conf.no-net:/etc/notnet.conf:ro
    command: ["notnet"]
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 5s
    # Runs in a loop. Press Ctrl-C to stop.
    # Expected: init logs, heartbeat timeout (no C2), scan cycle (timeout), repeat

  # ── Scenario B: Mock C2 test ──
  # Comment out bot-no-net to run scenario B only, or run both together
  mock-irc:
    image: python:3.11-slim
    container_name: mock-irc
    command: ["python3", "/app/mock_irc.py", "6667"]
    volumes:
      - ./tests:/app
    expose:
      - "6667"
    networks:
      - testnet

  mock-http:
    image: python:3.11-slim
    container_name: mock-http
    command: ["python3", "/app/mock_http.py", "8080"]
    volumes:
      - ./tests:/app
    expose:
      - "8080"
    networks:
      - testnet

  mock-ssh:
    image: python:3.11-slim
    container_name: mock-ssh
    command: ["python3", "/app/mock_ssh.py", "22"]
    volumes:
      - ./tests:/app
    expose:
      - "22"
    networks:
      - testnet

  mock-redis:
    image: python:3.11-slim
    container_name: mock-redis
    command: ["python3", "/app/mock_redis.py", "6379"]
    volumes:
      - ./tests:/app
    expose:
      - "6379"
    networks:
      - testnet

  bot-mock-c2:
    build: .
    container_name: notnet-mock-c2
    command: ["notnet"]
    depends_on:
      - mock-irc
      - mock-http
      - mock-ssh
      - mock-redis
    volumes:
      - ./tests/notnet.conf.mock:/etc/notnet.conf:ro
    networks:
      - testnet

  # ── Scenario C: Global killswitch test (#130) ──
  # Armed: the image is built with KILLSWITCH_DOMAIN=killswitch.test baked
  # in (compile-time, no runtime config), and /etc/hosts maps the domain
  # to 127.0.0.1 → the bot must self-destruct at boot (exit 0, no C2
  # connect, no persistence, no spread).
  bot-killswitch-armed:
    build:
      context: .
      args:
        KILLSWITCH_DOMAIN: killswitch.test
    container_name: notnet-killswitch-armed
    command: ["notnet"]
    network_mode: none
    extra_hosts:
      - "killswitch.test:127.0.0.1"
    volumes:
      - ./tests/notnet.conf.no-net:/etc/notnet.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 5s

  # Inert control: same baked domain, but /etc/hosts maps it to a normal
  # address (TEST-NET-1) → the bot must boot and run normally, no
  # self-destruct.
  bot-killswitch-inert:
    build:
      context: .
      args:
        KILLSWITCH_DOMAIN: killswitch.test
    container_name: notnet-killswitch-inert
    command: ["notnet"]
    network_mode: none
    extra_hosts:
      - "killswitch.test:192.0.2.1"
    volumes:
      - ./tests/notnet.conf.no-net:/etc/notnet.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 5s

networks:
  testnet:
    driver: bridge
