name: sim

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"          # nightly full regression
  workflow_dispatch: {}

jobs:
  smoke:
    name: sim smoke (c2-drive)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the real binary (host gate)
        run: make

      - name: Sim smoke — c2-drive (PR regression)
        run: |
          cd tests/sim
          ./run-sim.sh --scenario c2-drive --posture lax
        env:
          # Native docker daemon (GH runner VM) + passwordless sudo make the
          # DOCKER-USER firewall meaningful; dind would hide it in another
          # netns and false-FAIL the segmentation row.
          SUDO_PW: ""

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-smoke
          path: tests/sim/reports/

  c2-real:
    name: sim full suite against the real C2 (c2-server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the real binary (host gate)
        run: make

      - name: Sim full suite — real C2 (all 21 parity checks against c2-server)
        run: |
          cd tests/sim
          ./run-sim.sh --scenario all --posture standard --c2 real
        env:
          SUDO_PW: ""

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-c2-real
          path: tests/sim/reports/

      - name: Fail on silent no-report
        if: always()
        run: |
          test -n "$(ls tests/sim/reports/parity-*.md 2>/dev/null | head -1)" \
            || { echo "no parity report produced — run-sim.sh failed early"; exit 1; }

  dist-src:
    name: dist-src completeness + compile gate (#138 / #133)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Verify dist-src bundle is complete and on-target-compilable
        run: ./c2-server/verify_dist_src.sh

  tls:
    name: TLS build + smoke (TLS=1, pinned cert)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: TLS smoke (build TLS=1, handshake, pin, data path, fail-closed)
        run: ./c2-server/tls_smoke.sh

  mesh:
    name: P2P mesh command-signer trust gate (#139)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain + OpenSSL + python3
        run: sudo apt-get update && sudo apt-get install -y gcc libssl-dev python3

      - name: Build with MESH_ED25519 and run the host trust-gate test
        run: |
          make clean
          make MESH_ED25519=1
          gcc -DTLS_ENABLED -DMESH_ED25519 -I include -o /tmp/mesh_test tests/host/mesh_test.c \
            src/mesh.o src/util.o src/protocol.o src/persist.o src/spread.o src/payload.o \
            src/proxy.o src/deaddrop.o src/relay.o src/plugin.o src/killswitch.o \
            -lssl -lcrypto -lpthread
          /tmp/mesh_test

  full:
    name: sim full regression (all scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build the real binary (host gate)
        run: make

      - name: Sim full — all scenarios, standard posture
        run: |
          cd tests/sim
          ./run-sim.sh --scenario all --posture standard
        env:
          SUDO_PW: ""

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-full
          path: tests/sim/reports/

      - name: Fail on silent no-report
        if: always()
        run: |
          test -n "$(ls tests/sim/reports/parity-*.md 2>/dev/null | head -1)" \
            || { echo "no parity report produced — run-sim.sh failed early"; exit 1; }
