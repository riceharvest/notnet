name: detections

# Mirrors .github/workflows/sim.yml but gates the DEFENSIVE artifacts
# (detections/ + intel/), the other half of the project. A Sigma/Suricata/YARA
# rule can rot and no build used to fail; now it does. See issue #151.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    name: detection-as-code — schema + drift + replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate detections (schema, source-drift, replay)
        run: |
          python3 detections/validate.py --strict

      - name: Fail on silent no-rule
        if: always()
        run: |
          test -n "$(ls detections/sigma/*.yml detections/suricata/*.rules detections/yara/*.yar 2>/dev/null)" \
            || { echo "no detection rules present"; exit 1; }

  stix:
    name: STIX 2.1 intel — schema + drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Optional stix2 schema validation
        run: pip install --quiet stix2 || true

      - name: Build + assert intel bundle matches source (no drift)
        run: |
          python3 intel/build_intel.py
          python3 intel/build_intel.py --check

  guardrails:
    name: guardrails (#154) — disclosure + attestation presence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: README carries responsible-use/disclosure section
        run: |
          grep -q "Responsible Use & Disclosure" README.md \
            || { echo "README missing Responsible Use & Disclosure section (#154)"; exit 1; }
          grep -q "SECURITY.md" README.md \
            || { echo "README does not point at SECURITY.md (#154)"; exit 1; }

      - name: SECURITY.md present with disclosure contact + intended use
        run: |
          test -f SECURITY.md || { echo "SECURITY.md missing (#154)"; exit 1; }
          grep -qi "Responsible disclosure" SECURITY.md \
            || { echo "SECURITY.md missing disclosure policy"; exit 1; }

      - name: Killswitch is non-default (compile-time only, .invalid default)
        run: |
          grep -q 'KILLSWITCH_DOMAIN_DEFAULT   "killswitch.invalid"' include/config.h \
            || { echo "killswitch default must remain .invalid (non-defaultable, #130/#154)"; exit 1; }

      - name: Build attestation tool present
        run: |
          test -f attest.py || { echo "attest.py missing (#154)"; exit 1; }
          python3 attest.py --help >/dev/null 2>&1 || { echo "attest.py broken"; exit 1; }
