# notnet sim — fleet manifest. Every row = one device container.
# gen_fleet.py turns this into the compose override + per-device config.
#
# REAL-WORLD 2026 POSTURE: the fleet mirrors what a real attacker actually
# finds on the modern internet — most devices are patched and hardened
# (unique credentials, EDR, lockout, SSH key-only, SMB1 disabled, telnet
# gone), and botnets survive on a small LEGACY TAIL of unmanaged devices
# that still ship default credentials or unpatched CVEs.
#
# Device types (device.py profiles):
#   smart-fridge / smart-tv / printer / thermostat / baby-monitor : telnet + web
#   tbk-dvr         : CVE-2024-3721 (port 80)
#   huawei-hg532    : CVE-2017-17215 (port 37215)
#   realtek         : CVE-2021-35395 (port 80)
#   linux-pc        : SSH 22
#   windows-pc      : SMB 445 + RDP 3389
#   nas             : SSH 22 + SMB 445
#   redis-cache     : Redis 6379 (no auth)
#   redis-auth      : Redis 6379 (AUTH with pool password)
#   honeypot-*      : Cowrie container (real SSH/Telnet honeypot, never executes)
#
# Security flags (device.py):
#   patched          : CVE fingerprint absent -> probe miss -> no exploit
#   patched_partial  : fingerprint present, verify fails -> no drop
#   ssh_key_only     : rejects password auth entirely (modern SSHd)
#   smb1_disabled    : rejects SMB1 negotiate (modern Windows)
#   edr_block        : refuses to execute dropped payloads
#   lockout          : 5 failed auths -> 60s lock
#   strong creds     : credentials NOT in the bot's default pool (spread.c)
#
# Credential pool the bot tries (src/spread.c:112-127):
#   users  admin root user test guest pi ubuntu deploy ftp www oracle
#          postgres mysql mssql redis telnet default support info operator
#   passes admin password 123456 root toor pass test guest 12345 1234
#          123456789 letmein welcome monkey qwerty abc123 login default
#          111111 666666 123 123456789 changeme 123123 password1

segments:
  iot:     "172.29.10.0/24"
  office:  "172.29.20.0/24"
  dmz:     "172.29.30.0/24"

devices:
  # ══════════════════════════════════════════════════════════════════
  # MODERN / HARDENED tier — the majority. A 2026 attacker does NOT
  # crack these. Each feature here should FAIL the sim (that is the
  # real-world result).
  # ══════════════════════════════════════════════════════════════════

  # Modern smart fridge: patched firmware, telnet removed, no default creds
  - id: fridge-01
    type: smart-fridge
    segment: iot
    ip: 172.29.10.10
    ports: [80]
    patched: true
    strong_creds: true

  - id: fridge-02
    type: smart-fridge
    segment: iot
    ip: 172.29.10.11
    ports: [80]
    patched: true
    strong_creds: true

  # Modern camera: patched DVR firmware (CVE fixed), unique creds
  - id: cam-01
    type: tbk-dvr
    segment: iot
    ip: 172.29.10.12
    ports: [80]
    cve: CVE-2024-3721
    patched: true

  - id: cam-02
    type: tbk-dvr
    segment: iot
    ip: 172.29.10.13
    ports: [80]
    cve: CVE-2024-3721
    patched_partial: true     # old banner, vuln fixed

  # Modern router: TR-064 patched (HG532 dead), strong admin
  - id: router-01
    type: huawei-hg532
    segment: iot
    ip: 172.29.10.15
    ports: [37215]
    cve: CVE-2017-17215
    patched: true

  - id: router-02
    type: huawei-hg532
    segment: iot
    ip: 172.29.10.16
    ports: [37215]
    cve: CVE-2017-17215
    patched_partial: true

  # Modern Realtek router: Boa banner but patched
  - id: router-03
    type: realtek
    segment: iot
    ip: 172.29.10.17
    ports: [80]
    cve: CVE-2021-35395
    patched: true

  - id: router-04
    type: realtek
    segment: iot
    ip: 172.29.10.18
    ports: [80]
    cve: CVE-2021-35395
    patched_partial: true

  # Modern smart TV / thermostat / baby monitor / printer: no telnet, patched
  - id: tv-01
    type: smart-tv
    segment: iot
    ip: 172.29.10.19
    ports: [80]
    patched: true

  - id: thermostat-01
    type: thermostat
    segment: iot
    ip: 172.29.10.20
    ports: [80]
    patched: true

  - id: baby-monitor-01
    type: baby-monitor
    segment: iot
    ip: 172.29.10.21
    ports: [80]
    patched: true

  - id: printer-01
    type: printer
    segment: iot
    ip: 172.29.10.22
    ports: [80]
    patched: true

  # Modern Linux PCs: SSH key-only (password auth disabled), EDR, lockout
  - id: pc-01
    type: linux-pc
    segment: office
    ip: 172.29.20.10
    ports: [22]
    ssh_key_only: true
    edr_block: true
    lockout: true

  - id: pc-02
    type: linux-pc
    segment: office
    ip: 172.29.20.11
    ports: [22]
    ssh_key_only: false          # password auth allowed — but strong creds
    ssh_creds: ["dario:Xk7-mQ9-vR3-zL2-Wp8"]   # NOT in the bot's pool
    edr_block: true
    lockout: true                # 5 failures -> 60s lockout (real fail2ban)

  # Modern Windows PCs: SMB1 disabled, RDP with NLA, EDR
  - id: winpc-01
    type: windows-pc
    segment: office
    ip: 172.29.20.12
    ports: [445, 3389]
    smb1_disabled: true
    edr_block: true

  - id: winpc-02
    type: windows-pc
    segment: office
    ip: 172.29.20.13
    ports: [445, 3389]
    smb1_disabled: true
    edr_block: true

  # Modern NAS: SSH key-only, SMB1 off, strong creds
  - id: nas-01
    type: nas
    segment: office
    ip: 172.29.20.14
    ports: [22, 445]
    ssh_key_only: true
    smb1_disabled: true

  # Modern servers: SSH key-only, patched
  - id: server-01
    type: linux-pc
    segment: office
    ip: 172.29.20.15
    ports: [22]
    ssh_key_only: true

  - id: server-02
    type: linux-pc
    segment: office
    ip: 172.29.20.16
    ports: [22]
    ssh_key_only: true

  # DMZ: modern web server + Redis with requirepass (protected-mode)
  - id: web-01
    type: linux-pc
    segment: dmz
    ip: 172.29.30.10
    ports: [22]
    ssh_key_only: true

  # ══════════════════════════════════════════════════════════════════
  # VENDOR DIVERSITY tier (#102) — a second implementation of each
  # service class so per-vendor CVE claims are tested against more than
  # one vendor, and cross-vendor false positives are detectable (a CVE
  # module firing on a NON-matching vendor's device = a probe bug).
  # Each vendor gets a modern (patched/hardened) + legacy variant.
  # ══════════════════════════════════════════════════════════════════

  # Second DVR vendor: Dahua-style web service. The TBK module's probe
  # greps for TBK/DVR/NVR — this banner must NOT match (no false positive).
  - id: dahua-dvr-01
    type: dahua-dvr
    segment: iot
    ip: 172.29.10.40
    ports: [80]
    web_title: "Dahua Web Service"
    strong_creds: true

  - id: dahua-dvr-02
    type: dahua-dvr
    segment: iot
    ip: 172.29.10.41
    ports: [80, 23]
    web_title: "Dahua Web Service"
    telnet_creds: ["admin:123456"]   # legacy default creds in the bot's pool

  # Dahua partial-patch: same banner, but the web shell is fixed — no drop
  - id: dahua-dvr-03
    type: dahua-dvr
    segment: iot
    ip: 172.29.10.50
    ports: [80]
    web_title: "Dahua Web Service"
    patched_partial: true

  # Second router CVE profile: Tenda-style TR-064 on 37215. The HG532
  # module's probe requires the HUAWEIUPNP marker — this banner must NOT
  # match (proves HG532 is genuinely Huawei-specific).
  - id: tenda-router-01
    type: tenda-router
    segment: iot
    ip: 172.29.10.42
    ports: [37215]
    web_title: "Tenda TR-064"
    strong_creds: true

  - id: tenda-router-02
    type: tenda-router
    segment: iot
    ip: 172.29.10.43
    ports: [37215, 23]
    web_title: "Tenda TR-064"
    telnet_creds: ["root:admin"]

  # Tenda partial-patch: TR-064 answers, injection fixed — no drop
  - id: tenda-router-03
    type: tenda-router
    segment: iot
    ip: 172.29.10.51
    ports: [37215]
    web_title: "Tenda TR-064"
    patched_partial: true

  # Second smart-camera brand: Hikvision-style, different banner + creds
  - id: hikvision-cam-01
    type: hikvision-cam
    segment: iot
    ip: 172.29.10.44
    ports: [80]
    web_title: "Hikvision iVMS"
    strong_creds: true

  - id: hikvision-cam-02
    type: hikvision-cam
    segment: iot
    ip: 172.29.10.45
    ports: [80, 23]
    web_title: "Hikvision iVMS"
    telnet_creds: ["admin:12345"]

  # Hikvision partial-patch: banner served, CGI injection fixed
  - id: hikvision-cam-03
    type: hikvision-cam
    segment: iot
    ip: 172.29.10.52
    ports: [80]
    web_title: "Hikvision iVMS"
    patched_partial: true

  # Windows 10 vs Windows 11 split: win10 keeps SMB1 (the bot can
  # negotiate, then auth fails on strong creds); win11 is SMB2-only and
  # rejects the SMB1 negotiate outright.
  - id: win10-01
    type: windows-pc
    segment: office
    ip: 172.29.20.40
    ports: [445, 3389]
    smb1_disabled: false          # legacy SMB1 present — but strong creds
    strong_creds: true

  - id: win11-01
    type: windows-pc
    segment: office
    ip: 172.29.20.41
    ports: [445, 3389]
    smb1_disabled: true           # modern SMB2-only — negotiate rejected

  # Second NAS vendor: Synology-style, web admin on 5000/5001 + SSH
  - id: synology-nas-01
    type: nas
    segment: office
    ip: 172.29.20.42
    ports: [5000, 22]
    web_title: "Synology DSM"
    ssh_key_only: true
    smb1_disabled: true

  - id: synology-nas-02
    type: nas
    segment: office
    ip: 172.29.20.43
    ports: [5000, 22]
    web_title: "Synology DSM"
    ssh_creds: ["admin:admin"]

  # Managed switch / AP — a common worm target class the fleet lacked
  - id: switch-01
    type: managed-switch
    segment: iot
    ip: 172.29.10.46
    ports: [23, 80]
    web_title: "Netgear Switch"
    strong_creds: true

  - id: switch-02
    type: managed-switch
    segment: iot
    ip: 172.29.10.47
    ports: [23, 80]
    web_title: "Netgear Switch"
    telnet_creds: ["admin:admin"]

  - id: ap-01
    type: access-point
    segment: iot
    ip: 172.29.10.48
    ports: [80, 23]
    web_title: "Ubiquiti AP"
    strong_creds: true

  - id: ap-02
    type: access-point
    segment: iot
    ip: 172.29.10.49
    ports: [80, 23]
    web_title: "Ubiquiti AP"
    telnet_creds: ["root:123456"]

  - id: redis-01
    type: redis-auth
    segment: dmz
    ip: 172.29.30.11
    ports: [6379]
    redis_pass: "Kx9-mQ2-vR7-zL4-Xw8"    # strong, not in pool

  - id: db-01
    type: linux-pc
    segment: dmz
    ip: 172.29.30.13
    ports: [22]
    ssh_key_only: true

  # ══════════════════════════════════════════════════════════════════
  # LEGACY / UNMANAGED tail — the small population real botnets survive
  # on. Default credentials, unpatched CVEs, telnet still enabled.
  # These SHOULD be pwned by the sim (the real-world finding).
  # ══════════════════════════════════════════════════════════════════

  - id: legacy-cam-01
    type: tbk-dvr
    segment: iot
    ip: 172.29.10.30
    ports: [80, 23]
    cve: CVE-2024-3721
    telnet_creds: ["admin:123456"]

  - id: legacy-cam-02
    type: tbk-dvr
    segment: iot
    ip: 172.29.10.31
    ports: [80]
    cve: CVE-2024-3721

  - id: legacy-router-01
    type: huawei-hg532
    segment: iot
    ip: 172.29.10.32
    ports: [37215, 23]
    cve: CVE-2017-17215
    telnet_creds: ["root:toor"]

  - id: legacy-router-02
    type: realtek
    segment: iot
    ip: 172.29.10.33
    ports: [80, 23]
    cve: CVE-2021-35395
    telnet_creds: ["admin:admin"]

  - id: legacy-fridge-01
    type: smart-fridge
    segment: iot
    ip: 172.29.10.34
    ports: [23]
    telnet_creds: ["root:123456"]

  - id: legacy-pc-01
    type: linux-pc
    segment: office
    ip: 172.29.20.30
    ports: [22]
    ssh_creds: ["pi:password"]   # in the bot's pool -> crackable
    edr_block: true        # legacy box WITH an EDR — crack succeeds, exec blocked

  - id: legacy-server-01
    type: linux-pc
    segment: office
    ip: 172.29.20.31
    ports: [22]
    ssh_creds: ["root:toor"]
    persist: true          # S7 persistence test: payload relaunches after reboot

  - id: legacy-nas-01
    type: nas
    segment: office
    ip: 172.29.20.32
    ports: [22, 445]
    ssh_creds: ["admin:admin"]

  - id: legacy-redis-01
    type: redis-cache
    segment: dmz
    ip: 172.29.30.20
    ports: [6379]

  - id: legacy-redis-02
    type: redis-auth
    segment: dmz
    ip: 172.29.30.21
    ports: [6379]
    redis_pass: "password"

  - id: legacy-db-01
    type: linux-pc
    segment: dmz
    ip: 172.29.30.23
    ports: [22]
    ssh_creds: ["postgres:password"]   # in the bot's pool -> crackable

  # ══════════════════════════════════════════════════════════════════
  # Honeypots (Cowrie, never executes)
  # ══════════════════════════════════════════════════════════════════
  - id: honeypot-telnet-01
    type: honeypot-telnet
    segment: iot
    ip: 172.29.10.60
    ports: [23]

  - id: honeypot-ssh-01
    type: honeypot-ssh
    segment: dmz
    ip: 172.29.30.60
    ports: [22]
