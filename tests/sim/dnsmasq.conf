# notnet sim — dnsmasq config
# flux-c2 resolves to the live C2 IP (172.29.0.2) + a blackhole IP for
# fast-flux rotation testing. The bot points its resolver at this dnsmasq
# and uses the fixed search domain "sim.test" (compose dns_search), so the
# queries arrive as flux-c2.sim.test.
address=/flux-c2.sim.test/172.29.0.2
address=/flux-c2.sim.test/10.255.255.1
no-resolv
no-poll
log-queries
log-facility=-
interface=eth0
bind-interfaces
