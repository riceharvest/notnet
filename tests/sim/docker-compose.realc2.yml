# notnet sim — run the fleet against the REAL C2 (c2-server/) instead of the
# Python mocks. Merge on top of docker-compose.sim.yml:
#   docker compose -f docker-compose.sim.yml -f docker-compose.realc2.yml up ...
# (or ./run-sim.sh --c2 real)
#
# The three channel hostnames (c2 / c2-ws / c2-irc) each run a full real-C2
# instance on the SAME fixed IPs the mocks used, so the bot/device configs
# are unchanged. Each instance writes mock-format evidence lines to its own
# file (the driver's grep-based checks) and only serves queued commands to
# the attacker bot (172.29.0.9) — devices heartbeat to the same endpoints
# and would otherwise steal commands (#119).
name: notnet-sim

services:
  c2:
    # #324: digest-pinned — floating base-image tags rebuild upstream
    image: python:3.11-slim@sha256:9c900dea9e8fb7e16277c179b555cc72d29a352dbc33cff48ad5a0412fd5bfc7
    command: ["python3", "/app/c2.py", "--secret", "${SIM_C2_SECRET:-mocksecret}",
              "--http-port", "8080", "--payload-port", "8443",
              "--ws-port", "8081", "--irc-port", "6667",
              "--console-port", "8090",
              "--queue-dir", "/queue", "--payload-dir", "/payload",
              "--db", "/state/c2.db"]
    volumes:
      - ../../c2-server:/app
      - ./c2/socks5_client.py:/app/socks5_client.py:ro
      - ./queue:/queue
      - ./payload:/payload
      - ./evidence:/evidence
      - ./state:/state
    # Publish the operator console to the host so it can be watched during a
    # run without exec'ing into the container. Loopback-only; 8090 is left
    # free for other services — override with SIM_CONSOLE_HOST_PORT.
    ports:
      - "127.0.0.1:${SIM_CONSOLE_HOST_PORT:-8091}:8090"
    environment:
      SIM_EVIDENCE: /evidence/http.log
      SIM_BOT_IP: "172.29.0.9"

  c2-ws:
    # #324: digest-pinned — floating base-image tags rebuild upstream
    image: python:3.11-slim@sha256:9c900dea9e8fb7e16277c179b555cc72d29a352dbc33cff48ad5a0412fd5bfc7
    command: ["python3", "/app/c2.py", "--secret", "${SIM_C2_SECRET:-mocksecret}",
              "--http-port", "8080", "--payload-port", "8443",
              "--ws-port", "8081", "--irc-port", "6667",
              "--console-port", "8090",
              "--queue-dir", "/queue", "--payload-dir", "/payload",
              "--db", "/state/ws.db"]
    volumes:
      - ../../c2-server:/app
      - ./queue:/queue
      - ./payload:/payload
      - ./evidence:/evidence
      - ./state:/state
    environment:
      SIM_EVIDENCE: /evidence/ws.log
      SIM_BOT_IP: "172.29.0.9"

  c2-irc:
    # #324: digest-pinned — floating base-image tags rebuild upstream
    image: python:3.11-slim@sha256:9c900dea9e8fb7e16277c179b555cc72d29a352dbc33cff48ad5a0412fd5bfc7
    command: ["python3", "/app/c2.py", "--secret", "${SIM_C2_SECRET:-mocksecret}",
              "--http-port", "8080", "--payload-port", "8443",
              "--ws-port", "8081", "--irc-port", "6667",
              "--console-port", "8090",
              "--queue-dir", "/queue", "--payload-dir", "/payload",
              "--db", "/state/irc.db"]
    volumes:
      - ../../c2-server:/app
      - ./queue:/queue
      - ./payload:/payload
      - ./evidence:/evidence
      - ./state:/state
    environment:
      SIM_EVIDENCE: /evidence/irc.log
      SIM_BOT_IP: "172.29.0.9"
