# notnet sim — base topology (C2 infra + defence layer), flat network v1
# Device fleet is generated by gen_fleet.py into docker-compose.fleet.yml
# and composed on top of this file.
#
# Network: simnet 172.29.0.0/16 (flat). Segmentation is EMULATED by
# per-segment scan targeting: the bot's scan_targets only covers its own
# segment range (iot 172.29.10.x / office 172.29.20.x / dmz 172.29.30.x),
# mirroring what a bot on an isolated LAN segment would actually see.
# A real iptables router is documented as future work (requires macvlan /
# advanced Docker networking); the IDS/IPS layer works on evidence logs and
# needs no packet capture.
#
# Fixed addresses:
#   c2 172.29.0.2 (HTTP C2 8080 + payload 8443 + src tar)
#   c2-ws 172.29.0.3 (WS 8081)   c2-irc 172.29.0.4 (IRC 6667)
#   c2-backup 172.29.0.5 (8082)  deaddrop 172.29.0.6 (8090)
#   dnsmasq 172.29.0.7  ids-monitor 172.29.0.8
name: notnet-sim

services:
  # ── C2 infrastructure ──
  c2:
    image: python:3.11-slim
    container_name: sim-c2
    command: ["python3", "/app/c2_http.py"]
    volumes:
      - ./c2:/app
      - ./queue:/queue
      - ./evidence:/evidence
      - ./payload:/payload
    environment:
      SIM_C2_SECRET: ${SIM_C2_SECRET:-mocksecret}
      SIM_QUEUE_DIR: /queue
      SIM_EVIDENCE: /evidence/http.log
      SIM_PAYLOAD_DIR: /payload
      SIM_HTTP_PATH: /api/v1/bot
      SIM_ROLE: c2
    networks:
      simnet:
        ipv4_address: 172.29.0.2

  c2-ws:
    image: python:3.11-slim
    container_name: sim-c2-ws
    command: ["python3", "/app/c2_ws.py"]
    volumes:
      - ./c2:/app
      - ./queue:/queue
      - ./evidence:/evidence
    environment:
      SIM_C2_SECRET: ${SIM_C2_SECRET:-mocksecret}
      SIM_QUEUE_DIR: /queue
      SIM_EVIDENCE: /evidence/ws.log
      SIM_WS_PATH: /ws/v1/bot
      SIM_WS_PORT: "8081"
    networks:
      simnet:
        ipv4_address: 172.29.0.3

  c2-irc:
    image: python:3.11-slim
    container_name: sim-c2-irc
    command: ["python3", "/app/c2_irc.py"]
    volumes:
      - ./c2:/app
      - ./queue:/queue
      - ./evidence:/evidence
    environment:
      SIM_QUEUE_DIR: /queue
      SIM_EVIDENCE: /evidence/irc.log
      SIM_IRC_NICK: mockirc
      SIM_IRC_PORT: "6667"
    networks:
      simnet:
        ipv4_address: 172.29.0.4

  c2-backup:
    image: python:3.11-slim
    container_name: sim-c2-backup
    command: ["python3", "/app/c2_http.py"]
    volumes:
      - ./c2:/app
      - ./queue:/queue
      - ./evidence:/evidence
      - ./payload:/payload
    environment:
      SIM_C2_SECRET: ${SIM_C2_SECRET:-mocksecret}
      SIM_QUEUE_DIR: /queue
      SIM_EVIDENCE: /evidence/http-backup.log
      SIM_PAYLOAD_DIR: /payload
      SIM_HTTP_PATH: /api/v1/bot
      SIM_ROLE: backup
    networks:
      simnet:
        ipv4_address: 172.29.0.5

  deaddrop:
    image: python:3.11-slim
    container_name: sim-deaddrop
    command: ["python3", "/app/c2_deaddrop.py"]
    volumes:
      - ./c2:/app
      - ./evidence:/evidence
    environment:
      SIM_EVIDENCE: /evidence/deaddrop.log
      SIM_DROP_SERVER: c2
      SIM_DROP_PORT: "8080"
      SIM_C2_SECRET: ${SIM_C2_SECRET:-mocksecret}
      SIM_DEADDROP_PORT: "8090"
    networks:
      simnet:
        ipv4_address: 172.29.0.6

  dnsmasq:
    image: jpillora/dnsmasq
    container_name: sim-dnsmasq
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      simnet:
        ipv4_address: 172.29.0.7

  # ── Defence layer ──
  ids-monitor:
    build:
      context: ../..
      dockerfile: tests/sim/Dockerfile.ids
    image: notnet-sim-ids
    container_name: sim-ids
    environment:
      SIM_EVIDENCE: /evidence
      SIM_ALERT_FILE: /evidence/ids_alerts.log
      SIM_IPS: ${SIM_IPS:-0}
      SIM_BLACKLIST: /run/ips_blacklist
    volumes:
      - ./evidence:/evidence:rw
    networks:
      simnet:
        ipv4_address: 172.29.0.8

  # ── Bot (the attacker's payload) ──
  bot:
    image: notnet-sim-bot
    container_name: sim-bot
    command: ["notnet"]
    volumes:
      - ./conf/${SIM_BOT_CONF:-notnet.conf.c2drive}:/etc/notnet.conf:ro
    networks:
      simnet:
        ipv4_address: 172.29.0.9
    dns:
      - 172.29.0.7
    dns_search:
      - sim.test
    depends_on:
      - c2
      - c2-ws
    tmpfs:
      - /tmp

networks:
  simnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
