# notnet sim — base topology (C2 infra + defence layer)
# Device fleet is generated by gen_fleet.py into docker-compose.fleet.yml
# and composed on top of this file.
#
# Network: simnet 172.29.0.0/16. Devices carry REAL segment IPs
# (172.29.10.x iot / 172.29.20.x office / 172.29.30.x dmz) and the host
# firewall's DOCKER-USER rules enforce the segmentation policy on real
# packets. Full L2-separated bridges were attempted (#130) but this
# host's firewalld docker policies intercept cross-bridge routing —
# documented in issue #130.
#
# Fixed addresses (mgmt):
#   c2 172.29.0.2 (HTTP C2 8080 + payload 8443 + src tar)
#   c2-ws 172.29.0.3 (WS 8081)   c2-irc 172.29.0.4 (IRC 6667)
#   c2-backup 172.29.0.5 (8082)  deaddrop 172.29.0.6 (8090)
#   dnsmasq 172.29.0.7  ids-monitor 172.29.0.8
#   router 172.29.0.1/10.1/20.1/30.1 (one NIC per network)
name: notnet-sim

services:
  # ── C2 infrastructure ──
  c2:
    image: python:3.11-slim
    container_name: sim-c2
    command: ["python3", "/app/c2_http.py"]
    volumes:
      - ./c2:/app
      - ./queue:/queue
      - ./evidence:/evidence
      - ./payload:/payload
    environment:
      SIM_C2_SECRET: ${SIM_C2_SECRET:-mocksecret}
      SIM_QUEUE_DIR: /queue
      SIM_EVIDENCE: /evidence/http.log
      SIM_PAYLOAD_DIR: /payload
      SIM_HTTP_PATH: /api/v1/bot
      SIM_ROLE: c2
    networks:
      simnet:
        ipv4_address: 172.29.0.2

  c2-ws:
    image: python:3.11-slim
    container_name: sim-c2-ws
    command: ["python3", "/app/c2_ws.py"]
    volumes:
      - ./c2:/app
      - ./queue:/queue
      - ./evidence:/evidence
    environment:
      SIM_C2_SECRET: ${SIM_C2_SECRET:-mocksecret}
      SIM_QUEUE_DIR: /queue
      SIM_EVIDENCE: /evidence/ws.log
      SIM_WS_PATH: /ws/v1/bot
      SIM_WS_PORT: "8081"
    networks:
      simnet:
        ipv4_address: 172.29.0.3

  c2-irc:
    image: python:3.11-slim
    container_name: sim-c2-irc
    command: ["python3", "/app/c2_irc.py"]
    volumes:
      - ./c2:/app
      - ./queue:/queue
      - ./evidence:/evidence
    environment:
      SIM_QUEUE_DIR: /queue
      SIM_EVIDENCE: /evidence/irc.log
      SIM_IRC_NICK: mockirc
      SIM_IRC_PORT: "6667"
    networks:
      simnet:
        ipv4_address: 172.29.0.4

  c2-backup:
    image: python:3.11-slim
    container_name: sim-c2-backup
    command: ["python3", "/app/c2_http.py"]
    volumes:
      - ./c2:/app
      - ./queue:/queue
      - ./evidence:/evidence
      - ./payload:/payload
    environment:
      SIM_C2_SECRET: ${SIM_C2_SECRET:-mocksecret}
      SIM_QUEUE_DIR: /queue
      SIM_EVIDENCE: /evidence/http-backup.log
      SIM_PAYLOAD_DIR: /payload
      SIM_HTTP_PATH: /api/v1/bot
      SIM_ROLE: backup
    networks:
      simnet:
        ipv4_address: 172.29.0.5

  deaddrop:
    image: python:3.11-slim
    container_name: sim-deaddrop
    command: ["python3", "/app/c2_deaddrop.py"]
    volumes:
      - ./c2:/app
      - ./evidence:/evidence
    environment:
      SIM_EVIDENCE: /evidence/deaddrop.log
      SIM_DROP_SERVER: c2
      SIM_DROP_PORT: "8080"
      SIM_C2_SECRET: ${SIM_C2_SECRET:-mocksecret}
      SIM_DEADDROP_PORT: "8090"
    networks:
      simnet:
        ipv4_address: 172.29.0.6

  dnsmasq:
    image: jpillora/dnsmasq
    container_name: sim-dnsmasq
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      simnet:
        ipv4_address: 172.29.0.7

  # ── Defence layer ──
  suricata:
    build:
      context: .
      dockerfile: Dockerfile.suricata
    image: notnet-sim-suricata
    container_name: sim-suricata
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./evidence:/var/log/suricata:rw

  ids-monitor:
    build:
      context: ../..
      dockerfile: tests/sim/Dockerfile.ids
    image: notnet-sim-ids
    container_name: sim-ids
    environment:
      SIM_EVIDENCE: /evidence
      SIM_ALERT_FILE: /evidence/ids_alerts.log
      SIM_IPS: ${SIM_IPS:-0}
      SIM_BLACKLIST: /evidence/ips_blacklist
    volumes:
      - ./evidence:/evidence:rw
    networks:
      simnet:
        ipv4_address: 172.29.0.8

  # ── Honeytoken tripwire (#148) ──
  honeytoken:
    build:
      context: ../..
      dockerfile: tests/sim/Dockerfile.ids
    image: notnet-sim-ids
    container_name: sim-honeytoken
    command: ["python3", "/app/defence/honeytoken.py"]
    environment:
      SIM_EVIDENCE: /evidence
      HONEY_FILE: /app/conf/honeytokens.json
      HONEY_ALERT: /evidence/honeytoken_alerts.log
    volumes:
      - ./evidence:/evidence:rw
      - ./conf/honeytokens.json:/app/conf/honeytokens.json:ro
      - ./defence:/app/defence:ro
    networks:
      simnet:
        ipv4_address: 172.29.0.10

  # ── T-Pot-style honeypot tier (#149) ──
  # Cowrie (SSH/Telnet) is defined in docker-compose.fleet.yml (honeypot-ssh-01 /
  # honeypot-telnet-01). Here we add Dionaea for SMB (catches the bot's
  # smb1_write_file path, src/spread.c), plus the ELK stack + Filebeat that
  # give the captured TTPs one pane and feed them back into the Sigma/YARA
  # rules (detections/) and the ATT&CK matrix (#147).
  dionaea:
    image: honeynet/dionaea:latest
    container_name: sim-dionaea
    environment:
      DIONAEA_LOG: /opt/dionaea/var/log
    volumes:
      - ./evidence/dionaea:/opt/dionaea/var/log:rw
    networks:
      simnet:
        ipv4_address: 172.29.30.70
    ports:
      - "445:445"   # SMB — catches the bot's ADMIN$ drop

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: sim-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      simnet:
        ipv4_address: 172.29.0.11
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: sim-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://172.29.0.11:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      simnet:
        ipv4_address: 172.29.0.12

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: sim-filebeat
    user: root
    command: ["filebeat", "-e", "-c", "/etc/filebeat.yml"]
    volumes:
      - ./defence/filebeat.yml:/etc/filebeat.yml:ro
      - ./evidence:/evidence:rw
      - ./evidence/dionaea:/opt/dionaea/var/log:rw
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      simnet:
        ipv4_address: 172.29.0.13

  # ── Bot (the attacker's payload) ──
  bot:
    build:
      context: ../..
      dockerfile: tests/sim/Dockerfile.sim
    image: notnet-sim-bot
    container_name: sim-bot
    command: ["notnet"]
    volumes:
      - ./conf/${SIM_BOT_CONF:-notnet.conf.c2drive}:/etc/notnet.conf:ro
    networks:
      simnet:
        ipv4_address: 172.29.0.9
    dns:
      - 172.29.0.7
    dns_search:
      - sim.test
    depends_on:
      - c2
      - c2-ws
    tmpfs:
      - /tmp

networks:
  simnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  es-data:
