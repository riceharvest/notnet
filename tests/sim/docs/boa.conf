# Realtek Boa 0.94 config (TOTOLINK N300RT style) — created for the sim.
Port 80
User root
Group root
ServerName TOTOLINK
DocumentRoot /web
DirectoryIndex index.htm
KeepAliveMax 1000
KeepAliveTimeout 10
MimeTypes /etc/mime.types
DefaultType text/plain
CGIPath /bin:/usr/bin:/sbin:/usr/sbin
AddType application/x-httpd-cgi cgi
