# Cowrie honeypot config for the notnet sim (#149).
# Listens on the REAL service ports (22 ssh, 23 telnet) so the bot's
# scanner/spreader hits it directly. Logs go to /evidence (JSON + text) so
# Filebeat can ship them to ELK and they feed back into the Sigma/YARA rules
# (detections/) and the ATT&CK matrix (#147).
[ssh]
listen_endpoints = tcp:22:interface=0.0.0.0

[telnet]
listen_endpoints = tcp:23:interface=0.0.0.0

[shell]
filesystem = /cowrie/fs.pickle

# Log every command the bot issues inside the fake shell (full TTP capture).
[commands]
log_command = true

[database_jsonlog]
logfile = /evidence/cowrie.json

[log]
logfile = /evidence/cowrie.log

[honeypot]
contents_path = /cowrie/honeyfs
download_path = /cowrie/dl

# Research variable (issue #149): whether the bot's *probe* phase can
# distinguish a honeypot from a real device. Cowrie answers on a fixed banner
# and never reflects shell command output, so its fingerprint is detectable.
# We log the bot's probe/verify traffic verbatim so the driver can measure it.
[telnet]
# record the exact login banner exchange for fingerprintability analysis
bananagadfly = false
