# Cowrie honeypot config for the notnet sim (#149).
# Listens on Cowrie's native unprivileged ports (2222 ssh, 2223 telnet) —
# #328: the official image runs as uid 999 and cannot bind 22/23, and the
# fleet/driver target 172.29.x.60:2222/2223 (run_sim.py), so cfg, gen_fleet
# and run_sim all agree on 2222/2223. Logs go to /evidence (JSON + text) so
# Filebeat can ship them to ELK and they feed back into the Sigma/YARA rules
# (detections/) and the ATT&CK matrix (#147).
[ssh]
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
listen_endpoints = tcp:2223:interface=0.0.0.0
# record the exact login banner exchange for fingerprintability analysis
# (#149: whether the bot's *probe* phase can distinguish a honeypot from a
# real device — Cowrie answers on a fixed banner and never reflects shell
# command output; we log the bot's probe/verify traffic verbatim so the
# driver can measure it)

[shell]
filesystem = /cowrie/fs.pickle

# Log every command the bot issues inside the fake shell (full TTP capture).
[commands]
log_command = true

[database_jsonlog]
logfile = /evidence/cowrie.json

[log]
logfile = /evidence/cowrie.log

[honeypot]
contents_path = /cowrie/honeyfs
download_path = /cowrie/dl
